name: Build & Deploy

on:
  push:
    branches: [main]
  schedule:
    # Runs every 14 minutes to keep Render free tier from sleeping
    - cron: '*/14 * * * *'

jobs:
  # This job only runs on the schedule to keep the service awake
  keep-awake:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Ping Render Backend
        # Replace with your actual Render backend URL
        run: curl -s https://llm-state-manager.onrender.com/models > /dev/null

  build-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend Docker image
        run: docker build -t llm-state-backend ./backend

  build-frontend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build frontend Docker image
        run: docker build -t llm-state-frontend ./frontend

  deploy-backend:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    needs: [build-backend, build-frontend]
    steps:
      - name: Trigger Render Deploy
        run: |
          if [ -z "${{ secrets.RENDER_DEPLOY_HOOK }}" ]; then
            echo "Error: RENDER_DEPLOY_HOOK is not set in GitHub Secrets."
            exit 1
          fi
          curl -X POST "${{ secrets.RENDER_DEPLOY_HOOK}}"
